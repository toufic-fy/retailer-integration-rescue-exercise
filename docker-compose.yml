services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: retailer-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: workshop
      RABBITMQ_DEFAULT_PASS: workshop
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  billing:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "consumers/billing/consumer.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  delivery:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "consumers/delivery/consumer.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  crm:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "consumers/crm/consumer.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  order-management:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - ./events:/events
    working_dir: /app/order_management
    command: ["python", "publisher.py", "/events/happy_path_v0.json"]
